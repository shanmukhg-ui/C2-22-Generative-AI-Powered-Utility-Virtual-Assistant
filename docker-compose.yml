version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: utilityai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: utilityai
    volumes:
      - mongo_data:/data/db
    networks:
      - utilityai-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utilityai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-google/gemini-2.5-flash}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=utilityai
      - USE_MOCK_MONGO=${USE_MOCK_MONGO:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-techbharat-c222-utility}
      - JWT_SECRET=${JWT_SECRET:-utilityai-super-secret-key-change-in-production}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
      - ./datasets:/app/datasets:ro
      - chroma_data:/app/chroma_db
    networks:
      - utilityai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: utilityai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - utilityai-net

volumes:
  mongo_data:
    driver: local
  chroma_data:
    driver: local

networks:
  utilityai-net:
    driver: bridge

